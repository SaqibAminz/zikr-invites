<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zikr — Quran Journeys</title>
  <meta name="description" content="Read the Qur'an with your friends. Share a journey.">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f5f1;
      --card: #fff;
      --ink: #15302a;
      --muted: #7a8f89;
      --brand: #8a50ff;
      --line: #e2e5df;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1513;
        --card: #16201d;
        --ink: #eaf2ee;
        --muted: #9aaaa4;
        --brand: #8a50ff;
        --line: #243330;
      }
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.8rem;
    }
    p {
      margin: 0 0 20px;
      color: var(--muted);
    }
    .btn {
      display: block;
      width: 100%;
      padding: 15px 18px;
      border-radius: 12px;
      border: 0;
      background: var(--brand);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn.secondary {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
      font-weight: 500;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Zikr</h1>
    <p>Read the Qur'an with your friends. Share a journey.</p>
    <a class="btn" href="https://apps.apple.com/app/id6763501708">Download on the App Store</a>
    <a class="btn secondary" href="https://play.google.com/store/apps/details?id=com.app.azzikr">Get it on Google Play</a>
  </main>
</body>
</html>
